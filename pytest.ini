[pytest]
testpaths = tests
pythonpath = . backend
addopts = -ra --strict-markers
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    slow: takes more than a few seconds
    blender: requires a working Blender install
    synthetic: runs against Blender-rendered ground truth
    mcp: exercises the MCP server surface
filterwarnings =
    error::DeprecationWarning:app.*
